<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Faith's Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <h3>Faith's Portfolio</h3>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h1>Contact Me</h1>
            <p>Thank you for visiting my portfolio! If you would like to connect with me about my learning journey or projects, you can use the form below.</p>
        </section>

        <section>
            <h2>Send a Message</h2>
     <form action="https://formsubmit.co/faithkips003@gmail.com" method="POST">
            
                <label for="name">Your Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">Your Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

                <label for="subject">Subject</label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="What would you like to discuss?"
                    required
                >

                <label for="message">Your Message</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here"
                    required
                ></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Faith's Portfolio</p>
    </footer>

</body>
</html>
