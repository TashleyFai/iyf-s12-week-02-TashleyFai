<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Card Component</title>
    <link rel="stylesheet" href="day-2-card.css">
</head>
<body>

    <header>
        <h1>Day 2: Card Component</h1>
        <p>IYF Week 2 CSS Daily Challenge</p>
    </header>

    <main>
        <article class="card">
            <img 
                src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600"
                alt="Laptop on a desk">

            <div class="card-content">
                <h2>My Web Development Journey</h2>

                <p>
                    I am learning HTML, CSS and JavaScript
                    to become a professional software developer.
                </p>

                <div class="tags">
                    <span>HTML</span>
                    <span>CSS</span>
                    <span>Web Development</span>
                </div>

                <a href="https://github.com/TashleyFai" class="card-button">
                    View My GitHub
                </a>
            </div>
        </article>
    </main>

</body>
</html>
